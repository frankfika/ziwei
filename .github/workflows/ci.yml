name: CI

# 触发时机：每次 push 与每个 PR。
# 守门目标：**排盘结果被静默改掉**（引擎升级 / 改代码 / 换依赖）。
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 排盘回归 + 类型检查
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # v4 用的 Node 20 runtime 已被 GitHub 弃用（会强制跑在 Node 24 上并报警告），
      # v5 起是 Node 24 runtime。
      - name: 检出代码
        uses: actions/checkout@v5

      # 装 Node 20：与 package.json 的 engines 下限一致，
      # 故意用最低支持版本跑，守住「别把 engines 偷偷抬上去」。
      - name: 装 Node（20 LTS）
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      # 本仓库的 lockfile 由多个 agent 并行改动，npm ci 在 lock 与 package.json
      # 不同步时会直接失败；因此以 npm ci 为主、失败回落 npm install。
      - name: 装依赖
        run: npm ci || npm install --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      # 数据集（56GB）不进 git，CI 里没有。
      # 依赖数据的用例会明确 skip 并说明原因；
      # 纯引擎用例（金标准快照 / 确定性 / 边界 / 错误处理）必须真的跑起来 ——
      # 金标准快照在 tests/golden/*.json，已进 git，所以不依赖任何数据文件。
      - name: 回归测试
        run: npm test

      # 引文降级自测：检测与降级逻辑是许可硬化的关键路径，
      # 「降级不得引入新的括号破损 / 不得残留受限标记」这些不变量必须每次 push 都验。
      # 无数据集时真实数据那部分会明确 skip，其余断言照跑。
      - name: 引文降级自测
        run: npm run citation:selftest

      # 追问模块自测：零网络，只验 provider 抽象、提示词构造与防编造检查。
      - name: 追问模块自测
        run: npm run ask:selftest
